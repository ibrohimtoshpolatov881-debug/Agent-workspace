name: Build Agent APK for Redmi 10A (Android 11)

on:
  push:
    branches:
      - arena/4b229474-agent-workspace
    paths:
      - .github/workflows/build-redmi10a-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out Agent source
        uses: actions/checkout@v4
        with:
          repository: Past-da-king/agent
          ref: v0.11.8
          path: agent
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: agent/**/*.gradle*

      - name: Set up Node.js for the runtime pack
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" SDK package was retired; install current platform-tools only.
          packages: platform-tools

      - name: Inspect Android SDK platform packages
        shell: bash
        run: |
          sdkmanager --list --channel=3 > "$RUNNER_TEMP/sdk-packages.log" 2>&1
          packages=$(grep -oE 'platforms;android-[0-9]+(-[[:alnum:]._-]+)?' "$RUNNER_TEMP/sdk-packages.log" | sort -u | paste -sd ' ' - || true)
          echo "::notice title=Available Android SDK platforms::$packages"

      - name: Accept preview Android SDK licenses
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          result = subprocess.run(
              ["sdkmanager", "--channel=3", "--licenses"],
              input=("y" + chr(10)) * 30,
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
          )
          print(result.stdout)
          raise SystemExit(result.returncode)
          PY

      - name: Install Android SDK platform 37
        run: sdkmanager --channel=3 --install "platforms;android-37"

      - name: Install patchelf for the bundled runtime pack
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf

      - name: Patch upstream runtime-pack edge cases
        working-directory: agent
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script = Path("tools/build-runtime-pack.sh")
          text = script.read_text()
          replacements = {
              "f&&/^V:/{print substr($0,3); exit}": "f&&/^V:/{print substr($0,3); f=0}",
              'chmod 755 "$JNI/libcodex.so" "$JNI/librg.so"': 'chmod 755 "$JNI/libcodex.so"; [ ! -f "$JNI/librg.so" ] || chmod 755 "$JNI/librg.so"',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"Expected runtime-pack fragment not found exactly once: {old}")
              text = text.replace(old, new, 1)
          script.write_text(text)
          PY

      - name: Build bundled arm64 runtime pack
        working-directory: agent
        shell: bash
        run: |
          set +e
          ./tools/build-runtime-pack.sh > "$RUNNER_TEMP/runtime-pack.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/runtime-pack.log"
          if [ "$status" -ne 0 ]; then
            details=$(tr '\r' '\n' < "$RUNNER_TEMP/runtime-pack.log" | tail -n 20 | tr '\n' ' ')
            echo "::error title=Runtime pack build failed::$details"
          fi
          exit "$status"

      - name: Add static arm64 ripgrep to the runtime pack
        shell: bash
        run: |
          set -euo pipefail
          url=https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-aarch64-unknown-linux-musl.tar.gz
          curl --fail --location --silent --show-error --retry 3 "$url" -o "$RUNNER_TEMP/ripgrep.tar.gz"
          echo "800b1e7206afe799dfb5a6901f23147cfaabe0e52210538100f61e86e1740915  $RUNNER_TEMP/ripgrep.tar.gz" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/ripgrep"
          tar -xzf "$RUNNER_TEMP/ripgrep.tar.gz" -C "$RUNNER_TEMP/ripgrep"
          cp "$RUNNER_TEMP/ripgrep/ripgrep-15.2.0-aarch64-unknown-linux-musl/rg" agent/app/src/main/jniLibs/arm64-v8a/librg.so
          chmod 755 agent/app/src/main/jniLibs/arm64-v8a/librg.so
          if patchelf --print-interpreter agent/app/src/main/jniLibs/arm64-v8a/librg.so >/dev/null 2>&1; then
            patchelf --set-interpreter /data/user/0/com.past9.phoneaos/files/runtime/bin/ld-musl-aarch64.so.1 agent/app/src/main/jniLibs/arm64-v8a/librg.so
          fi

      - name: Assemble installable APK
        working-directory: agent
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --console=plain --stacktrace -PagentName=Agent -PagentIcon=ic_launcher assembleDebug > "$RUNNER_TEMP/gradle-build.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/gradle-build.log"
          if [ "$status" -ne 0 ]; then
            details=$(grep -E '^(e:|FAILURE:|[[:space:]]*What went wrong|[[:space:]]*> |.*error:|.*requires )' "$RUNNER_TEMP/gradle-build.log" | tail -n 15 | paste -sd ' ' -)
            if [ -z "$details" ]; then
              details=$(tail -n 15 "$RUNNER_TEMP/gradle-build.log" | paste -sd ' ' -)
            fi
            echo "::error title=Gradle assembleDebug failed::$details"
          fi
          exit "$status"

      - name: Prepare download
        shell: bash
        run: |
          set -euo pipefail
          cp agent/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Agent-Redmi10A-Android11.apk"
          cat > "$RUNNER_TEMP/BUILD-INFO.txt" <<'EOF'
          Source: Past-da-king/agent, tag v0.11.8
          Application: com.past9.phoneaos (Agent 0.11.8, versionCode 61)
          Device target: arm64-v8a; minSdk 29, targetSdk 36; Android 11 (API 30) is supported
          compileSdk: 37; targetSdk: 36
          Runtime pack: included (Node, Codex, Claude Code)
          Build: debug-signed APK; it cannot update an existing release-signed installation.
          EOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Redmi10A-Android11
          path: |
            ${{ runner.temp }}/Agent-Redmi10A-Android11.apk
            ${{ runner.temp }}/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
