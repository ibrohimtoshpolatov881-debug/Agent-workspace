name: Build Agent APK for Redmi 10A (Android 11)

on:
  push:
    branches:
      - arena/4b229474-agent-workspace
    paths:
      - .github/workflows/build-redmi10a-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out Agent source
        uses: actions/checkout@v4
        with:
          repository: Past-da-king/agent
          ref: v0.11.8
          path: agent
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: agent/**/*.gradle*

      - name: Set up Node.js for the runtime pack
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and native build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37"
          sudo apt-get update
          sudo apt-get install -y patchelf

      - name: Build bundled arm64 runtime pack
        working-directory: agent
        run: ./tools/build-runtime-pack.sh

      - name: Assemble installable APK
        working-directory: agent
        run: ./gradlew --no-daemon --stacktrace -PagentName=Agent -PagentIcon=ic_launcher assembleDebug

      - name: Prepare download
        shell: bash
        run: |
          set -euo pipefail
          cp agent/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Agent-Redmi10A-Android11.apk"
          cat > "$RUNNER_TEMP/BUILD-INFO.txt" <<'EOF'
          Source: Past-da-king/agent, tag v0.11.8
          Application: com.past9.phoneaos (Agent 0.11.8, versionCode 61)
          Device target: arm64-v8a; min Android 10 (API 29), so Android 11 (API 30) is supported
          Runtime pack: included (Node, Codex, Claude Code)
          Build: debug-signed APK; it cannot update an existing release-signed installation.
          EOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Redmi10A-Android11
          path: |
            ${{ runner.temp }}/Agent-Redmi10A-Android11.apk
            ${{ runner.temp }}/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
